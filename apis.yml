aid: trusted-health
name: Trusted Health
description: >-
  Trusted Health is a career marketplace and workforce platform for travel nurses and allied
  health professionals across the United States. Clinicians build a single Trusted profile and get
  matched to travel and per-diem assignments, with transparent pay, licensure and compact-state
  guidance, and support through onboarding, credentialing, and placement. Its Works.AI product gives
  healthcare employers an AI-assisted staffing and workforce-management tool. Backed by Craft
  Ventures, Trusted Health operates a consumer web and mobile application (app.trustedhealth.com)
  rather than a public developer API; no OpenAPI, developer portal, or SDK surface is published. This
  profile captures the company's real security, trust, and compliance posture.
